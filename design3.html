<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poster Designs | Zing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="assets/style/design3.css">

</head>

<body>

  <section class="cards">
        <div class="design3">
            <div class="card" style="width: 25rem;">
                <div class="logo">
                    <img src="assets/images/logo.png" class="card-img-top" alt="logo">

                </div>
                <div class="card-body mx-5">
                    <div class="headings text-start">
                        <div class="card-heading1">
                            Delicious & fresh
                        </div>
                        <div class="card-heading2">
                            Tom Yum Goong
                        </div>
                    </div>

                    <div class="card-description">
                        <p class="card-text">A Zinger Burger is a popular fast-food burger from KFC featuring a crispy,
                            spicy chicken fillet on a sesame seed bun with lettuce, mayo, and often cheese.
                        </p>
                    </div>
                    <div class="menu-image">
                        <img src="assets/images/tom-yum.png" alt="biriyani-image">
                    </div>
                    <div class="restaurant-details text-center">
                        <div class="restaurant-name fw-bold">
                            ZATO THAI CUISINE
                        </div>
                        <div class="restaurant-address">
                            9090 Skillman St, Dallas, TX 75243, USA
                        </div>
                    </div>


                </div>
                <div class="card-footer-custom">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="contact-number d-flex align-items-center gap-2">
                            <i class="bi bi-telephone-fill"></i>
                            4692943680
                        </div>

                        <div class="website d-flex align-items-center gap-2">
                            <i class="bi bi-globe"></i>
                            www.zatothaicuisine.site
                        </div>
                    </div>
                </div>
            </div>
        </div>


    </section>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>

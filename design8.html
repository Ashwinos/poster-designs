<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poster Designs | Zing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=League+Gothic&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lavishly+Yours&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=League+Spartan:wght@100..900&family=Lexend+Deca:wght@100..900&family=Oswald:wght@200..700&family=Sacramento&display=swap"
        rel="stylesheet">

  <link rel="stylesheet" href="assets/style/design8.css">

</head>

<body>

  <section class="cards">
              <div class="design8">
            <div class="card" style="width: 25rem;">
                <div class="logo">
                    <img src="assets/images/logo.png" class="card-img-top" alt="logo">
                </div>
                <div class="headings text-center">
                    <div class="card-heading1">
                        THAI SPICY
                    </div>
                    <div class="card-heading2">
                        FRIED RICE
                    </div>
                </div>
                <div class="card-body">

                    <div class="menu-image">
                        <img src="assets/images/thai-rice.png" alt="biriyani-image">
                    </div>
                    <div class="card-description">
                        <p class="card-text">A Zinger Burger is a popular fast-food burger from KFC featuring a
                            crispy,
                            spicy chicken fillet on a sesame seed bun with lettuce, mayo, and often cheese.
                        </p>
                    </div>
                    <div class="restaurant-details text-center text-dark">
                        <div class="restaurant-name fw-bold">
                            ZATO THAI CUISINE
                        </div>
                        <div class="restaurant-address">
                            9090 Skillman St, Dallas, TX 75243, USA
                        </div>
                    </div>
                </div>
                <div class="card-footer text-dark">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="contact-number d-flex align-items-center gap-2">
                            <i class="bi bi-telephone-fill"></i>
                            4692943680
                        </div>

                        <div class="website d-flex align-items-center gap-2">
                            <i class="bi bi-globe"></i>
                            www.zatothaicuisine.site
                        </div>
                    </div>
                </div>
            </div>
        </div>  

    </section>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
